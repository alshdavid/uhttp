name: Release

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - "main"

jobs:
  version:
    name: 🌐 Auto Version Increment
    runs-on: ubuntu-24.04
    outputs:
      VERSION: ${{ steps.generate.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v7
      - id: generate
        run: |
          set -ex
          LAST_VERSION=$(curl -sSL https://api.github.com/repos/alshdavid/uhttp/releases/latest | jq -r ".tag_name" | cut -d "." -f 3)
          if [ "$LAST_VERSION" = "" ]; then
            # Commenting out to protect against overriding on error
            # LAST_VERSION="0"
            echo "Version Missing"
            exit 1
          fi

          declare -i var="$LAST_VERSION"
          var=$var+1
          VERSION="0.0.$var"

          echo $VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: 🧪 Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  format:
    name: 📝 Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-xfmt
      - run: cargo xfmt --check

  lint:
    name: 🤓 Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --workspace -- -D warnings

  check:
    name: 🧀 Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  publish_github_release:
    name: "🔄 Publish Github Release"
    runs-on: ubuntu-24.04
    needs:
      - version
      - test
      - format
      - lint
      - check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish` Github Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{needs.version.outputs.VERSION}}
        run: |
          set -ex

          echo "Tag: ${VERSION}"

          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create $VERSION --draft --notes "Generating Changelog..."
          gh release edit "$VERSION" --title "v${VERSION}"

          gh release edit $VERSION --draft=false

          payload="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg version "$VERSION" \
            '{repository: $repository, version: $version}')"

          curl -fsS -X POST "${{ secrets.SENTINEL_CHANGELOG_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "$payload" || true

  publish_crates_io:
    name: "🔁 Publish: Crate"
    runs-on: ubuntu-latest
    needs:
      - version
      - test
      - format
      - lint
      - check
    steps:
      - uses: actions/checkout@v7
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{needs.version.outputs.VERSION}}
        run: |
          set -e
          sed "s/0.0.0-local/${VERSION}/g" "Cargo.toml" > "Cargo.toml.new" && mv "Cargo.toml.new" "Cargo.toml"
          cargo publish --allow-dirty
