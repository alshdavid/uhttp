[workspace]
resolver = "2"

members = ["./crates/*", "./examples/*"]

[workspace.lints.rust]
elided_lifetimes_in_paths = "allow"
rust_2018_idioms = { priority = -1, level = "deny" }

[workspace.lints.clippy]
module_inception = "allow"
uninlined-format-args = "allow"

[profile.release]
opt-level = 3
debug = false
lto = true
strip = "debuginfo"
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22.1"
futures = "0.3"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
path-tree = "0.8"
percent-encoding = "2"
rustls-pemfile = "2"
serde = "1"
serde_json = "1"
sha1 = "0.11.0"
tokio = "1"
tokio-rustls = "0.26"
tokio-tungstenite = "0.29.0"
tokio-util = "0.7"
